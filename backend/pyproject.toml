[project]
name = "estudatta-backend"
version = "0.1.0"
description = "Estudatta — API, domínio, persistência e jobs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy==2.0.54",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.5",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "email-validator==2.3.0",
  "celery[redis]==5.6.3",
  "redis>=5.0.3,<6.5",
  "argon2-cffi==25.1.0",
  "pywebpush==2.5.0",
  "pypdf==6.19.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "itsdangerous==2.2.0",
  "structlog==26.1.0",
  "boto3==1.43.97",
  "authlib==1.8.0",
  "jinja2==3.1.6",
  "python-dateutil==2.9.0.post0",
  "python-magic==0.4.27",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.8",
  "mypy==2.3.1",
  "freezegun==1.5.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
