# Nginx do container do app (PWA): arquivos estáticos + fallback SPA + proxy /api → api:8000.
# O site público é servido por outro projeto (estudatta-site). Em produção, um Nginx/Caddy
# externo com TLS fica na frente (ver docs/deploy.md).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

    # API na mesma origem do app (cookies SameSite=Lax funcionam sem CORS para o app)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 30m;
    }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Todas as rotas do app → shell
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
