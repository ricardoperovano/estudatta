<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5fe" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Estudatta" />
    <meta name="application-name" content="Estudatta" />
    <link rel="icon" href="/marca/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/marca/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="/marca/apple-touch-icon-180.png" />
    <title>Estudatta</title>
    <meta name="robots" content="noindex, nofollow" />
    <script>
      (function () {
        try {
          // padrão claro; "system" segue o aparelho; "dark" é escolha explícita
          var t = localStorage.getItem("estudatta.theme") || "light";
          if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
